name: trailer-cinematic
# One machine, one run: prep (real numbers from the releases) -> stills -> Remotion renders (30 and 60 fps) -> two-pass encode -> release `trailer-cinematic`.
# Cheap iteration: stills_only=true renders just the stills; segment="start-end" renders a short 30 fps segment (frames) as an artifact.
on:
  workflow_dispatch:
    inputs:
      stills_only:
        description: "only render stills (no full render, no release)"
        type: boolean
        default: false
      segment:
        description: "optional short 30 fps segment, frames like 300-420 (artifact only, no release)"
        default: ""
      stills:
        description: "still times in seconds"
        default: "2 8 14 21 28 36 44 52 58 64 70 75 78 81 86 91 95"
permissions:
  contents: write
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 || true
          pip install -q requests
      - name: Prep (releases, eval.json, clips, live card, grain)
        run: |
          python3 trailer/tools/prep_cine.py
          cp trailer/audio/cinematic.mp3 trailer/public-cine/cinematic.mp3
      - name: Install
        working-directory: trailer
        run: npm install --no-audit --no-fund
      - name: Stills
        working-directory: trailer
        run: |
          mkdir -p out stills-out
          for T in ${{ inputs.stills }}; do
            F=$(python3 -c "print(int(round($T*30)))")
            npx remotion still src/cine/index.ts Cine30 out/s.png --frame=$F --props=props-cine.json --public-dir=public-cine --log=error
            ffmpeg -y -v error -i out/s.png -q:v 3 stills-out/cine-t$T.jpg
          done
          ls stills-out
      - uses: actions/upload-artifact@v4
        with:
          name: cine-stills
          path: trailer/stills-out
      - name: Segment render
        if: ${{ inputs.segment != '' && !inputs.stills_only }}
        working-directory: trailer
        run: |
          npx remotion render src/cine/index.ts Cine30 out/seg.mp4 --frames=${{ inputs.segment }} --props=props-cine.json --public-dir=public-cine --concurrency=4 --crf=24 --log=warn
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.segment != '' && !inputs.stills_only }}
        with:
          name: cine-segment
          path: trailer/out/seg.mp4
      - name: Render 30 fps
        if: ${{ inputs.segment == '' && !inputs.stills_only }}
        working-directory: trailer
        run: npx remotion render src/cine/index.ts Cine30 out/raw30.mp4 --props=props-cine.json --public-dir=public-cine --concurrency=4 --crf=14 --timeout=180000 --log=warn
      - name: Render 60 fps
        if: ${{ inputs.segment == '' && !inputs.stills_only }}
        working-directory: trailer
        run: npx remotion render src/cine/index.ts Cine60 out/raw60.mp4 --props=props-cine.json --public-dir=public-cine --concurrency=4 --crf=14 --timeout=180000 --log=warn
      - name: Two-pass encode (about 22 MB), yuv420p checks
        if: ${{ inputs.segment == '' && !inputs.stills_only }}
        run: |
          set -e
          VB=$(python3 -c "print(int(22.0e6*8/96 - 140000))")
          for N in 30 60; do
            ffmpeg -y -v error -i trailer/out/raw$N.mp4 -c:v libx264 -preset slow -b:v $VB -pass 1 -an -f null /dev/null
            ffmpeg -y -v error -i trailer/out/raw$N.mp4 -c:v libx264 -preset slow -b:v $VB -pass 2 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart trailer-cinematic-$N.mp4
            ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,duration -of default=nw=1 trailer-cinematic-$N.mp4
            PF=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 trailer-cinematic-$N.mp4)
            [ "$PF" = "yuv420p" ] || { echo "pix_fmt is $PF"; exit 1; }
            SZ=$(stat -c %s trailer-cinematic-$N.mp4); echo "size $N: $SZ"
            [ "$SZ" -lt 24000000 ] || { echo "too big"; exit 1; }
          done
      - name: Release trailer-cinematic
        if: ${{ inputs.segment == '' && !inputs.stills_only }}
        run: |
          gh release view trailer-cinematic -R ${{ github.repository }} >/dev/null 2>&1 || gh release create trailer-cinematic -R ${{ github.repository }} --title "Trailer (cinematic)" --notes "Cinematic cut: trailer-cinematic-30.mp4 (1080p30), trailer-cinematic-60.mp4 (1080p60). 2.39:1 letterbox, score on real sampled instruments (MuseScore_General SoundFont, MIT)." --latest=false
          gh release upload trailer-cinematic trailer-cinematic-30.mp4 trailer-cinematic-60.mp4 -R ${{ github.repository }} --clobber
