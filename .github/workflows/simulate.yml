name: simulate
run-name: sim ${{ inputs.id }}
# One Simulation Lab request (dispatched by the local relay; spec validated again here before use).
on:
  workflow_dispatch:
    inputs:
      id: {description: "request id", required: true}
      spec: {description: "spec JSON", required: true}
      model_tag: {description: "baseline or round-N", required: true}
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      LP_NUM_THREADS: "2"
      SPEC: ${{ inputs.spec }}
      MODEL_TAG: ${{ inputs.model_tag }}
      SIM_ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip, cache-dependency-path: .github/workflows/simulate.yml}
      - name: Check inputs
        run: |
          echo "$SIM_ID" | grep -Eq '^[a-z0-9]{6,16}$'
          echo "$MODEL_TAG" | grep -Eq '^(baseline|round-[0-9]{1,3})$'
          printf '%s' "$SPEC" > spec.json
      - name: System packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg openjdk-8-jdk xvfb mesa-utils libegl1 libgl1-mesa-dri libglu1-mesa-dev libgl1-mesa-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH
      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q minestudio attrs psutil "numpy<2"
      - name: Engine
        run: python -c "from minestudio.simulator.entry import check_engine; check_engine(skip_confirmation=True)"
      - name: Weights
        run: |
          mkdir -p w
          if [ "$MODEL_TAG" = "baseline" ]; then
            curl -sfL -o w/model.weights https://openaipublic.blob.core.windows.net/minecraft-rl/models/foundation-model-1x.weights
          else
            gh release download "$MODEL_TAG" -p global.weights -O w/model.weights
          fi
      - name: Simulate
        run: xvfb-run -a -s "-screen 0 1024x768x24" python cloud/sim_custom.py --spec spec.json --weights w/model.weights --model-tag "$MODEL_TAG" --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "sim-${{ inputs.id }}", path: out, retention-days: 3}
