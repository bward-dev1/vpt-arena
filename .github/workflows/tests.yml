name: tests
on:
  workflow_dispatch:
  push:
    # only training/sim code; site, docs and workflow edits don't need the 20-minute suite
    paths: ["vpt_arena/**", "cloud/**", "tests/**", "configs/**", "!vpt_arena/site/**", "!configs/compute.json"]
concurrency: {group: tests, cancel-in-progress: true}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy opencv-python-headless attrs
      - run: python -W ignore -m tests.smoke
      - run: python -W ignore -m tests.arena_test
      - run: python -W ignore -m tests.server_test
      - run: python -W ignore -m tests.live_test
      - run: python -W ignore -m tests.idm_test
      - run: python -W ignore -m tests.site_test
      - run: python -W ignore -m tests.rl_test
