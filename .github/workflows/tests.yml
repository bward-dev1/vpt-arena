name: tests
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy opencv-python-headless attrs
      - run: python -W ignore -m tests.smoke
      - run: python -W ignore -m tests.arena_test
      - run: python -W ignore -m tests.server_test
      - run: python -W ignore -m tests.live_test
      - run: python -W ignore -m tests.idm_test
      - run: python -W ignore -m tests.site_test
      - run: python -W ignore -m tests.rl_test
