name: probe-simulator
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "8"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libegl1 libgl1-mesa-dri libglu1-mesa-dev libgl1-mesa-dev
      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q minestudio
      - name: Engine
        run: python -c "from minestudio.simulator.entry import check_engine; check_engine(skip_confirmation=True)"
      - name: Probe
        run: xvfb-run -a -s "-screen 0 1024x768x24" python cloud/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: probe, path: cloud_out}
