name: trailer
# Builds the VPT Arena hype trailer in the cloud: clips + data + site screenshots + original music -> Remotion renders
# (1080p30 main, 1080p60 main, 1080x1920 vertical) -> release `trailer`. Nothing is rendered locally.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q requests brotli numpy
      - name: Clips, data, screenshots, walls, props
        run: python3 trailer/tools/prep.py
      - name: Music (original, synthesised)
        run: |
          python3 trailer/audio/make_music.py main trailer/public/music-main.wav
          python3 trailer/audio/make_music.py vertical trailer/public/music-vertical.wav
      - name: Screenshots as a viewable artifact
        run: mkdir -p shots-out && cp trailer/public/shots/* shots-out/ || true
      - uses: actions/upload-artifact@v4
        with: {name: shots, path: shots-out}
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            trailer/public
            trailer/props.json
            trailer/data.json
          compression-level: 0
  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {comp: Main30, name: trailer-30, dur: 75, stills: "3.5 9.5 18 30 40 50 57 64 70 72"}
          - {comp: Main60, name: trailer-60, dur: 75, stills: "10 41 71"}
          - {comp: Vertical, name: trailer-vertical, dur: 30, stills: "2 7 13 19 24 28"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: trailer
      - name: System libraries for headless Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 ffmpeg || true
      - name: Install
        working-directory: trailer
        run: npm install --no-audit --no-fund
      - name: Render ${{ matrix.comp }}
        working-directory: trailer
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ matrix.comp }} out/raw.mp4 --props=props.json --concurrency=4 --crf=16 --timeout=180000 --log=warn
      - name: Final encode (size cap 22 MB, yuv420p) and checks
        run: |
          set -e
          DUR=${{ matrix.dur }}
          VB=$(python3 -c "print(int(21e6*8/$DUR - 170000))")
          ffmpeg -y -v error -i trailer/out/raw.mp4 -c:v libx264 -preset slow -b:v $VB -maxrate $((VB*14/10)) -bufsize $((VB*2)) -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart ${{ matrix.name }}.mp4
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,duration -of default=nw=1 ${{ matrix.name }}.mp4
          PF=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 ${{ matrix.name }}.mp4)
          [ "$PF" = "yuv420p" ] || { echo "pix_fmt is $PF"; exit 1; }
          SZ=$(stat -c %s ${{ matrix.name }}.mp4); echo "size $SZ"
          [ "$SZ" -lt 24000000 ] || { echo "too big"; exit 1; }
      - name: Stills
        run: |
          mkdir -p stills-out
          i=0
          for T in ${{ matrix.stills }}; do i=$((i+1)); ffmpeg -y -v error -ss $T -i ${{ matrix.name }}.mp4 -frames:v 1 -q:v 3 stills-out/${{ matrix.name }}-$(printf %02d $i)-t$T.jpg; done
          ls -la stills-out
      - uses: actions/upload-artifact@v4
        with:
          name: stills-${{ matrix.name }}
          path: stills-out
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.name }}
          path: ${{ matrix.name }}.mp4
          compression-level: 0
  release:
    needs: render
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "out-*"
          path: files
          merge-multiple: true
      - name: Upload to release trailer
        run: |
          ls -la files
          gh release view trailer -R ${{ github.repository }} >/dev/null 2>&1 || gh release create trailer -R ${{ github.repository }} --title "Trailer" --notes "VPT Arena hype trailer: trailer-30.mp4 (1080p30), trailer-60.mp4 (1080p60), trailer-vertical.mp4 (1080x1920). Built by the trailer workflow from live site data." --latest=false
          gh release upload trailer files/*.mp4 -R ${{ github.repository }} --clobber
