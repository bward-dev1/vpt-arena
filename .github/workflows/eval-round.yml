name: eval-round
# Evaluate a policy (a round release, or the VPT foundation baseline) on all 23 modes; results go on the release.
on:
  workflow_dispatch:
    inputs:
      tag: {description: "release tag with global.weights, or 'baseline' for VPT foundation 1x", default: "baseline"}
      episodes: {description: "episodes per mode", default: "3"}
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        modes:
          - "survival,duels_sword,duels_classic,duels_uhc,duels_nodebuff,duels_sumo"
          - "duels_boxing,duels_bow,duels_combo,build_uhc,bedwars_solo,bedwars_doubles"
          - "bedwars_squads,skywars_solo,skywars_doubles,the_bridge,uhc,survival_games"
          - "kitpvp,capture_the_wool,spleef,tnt_run,parkour_duel"
    env:
      GH_TOKEN: ${{ github.token }}
      LP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: System packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg openjdk-8-jdk xvfb mesa-utils libegl1 libgl1-mesa-dri libglu1-mesa-dev libgl1-mesa-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH
      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q minestudio attrs psutil "numpy<2"
      - name: Engine
        run: python -c "from minestudio.simulator.entry import check_engine; check_engine(skip_confirmation=True)"
      - name: Weights
        run: |
          mkdir -p w
          B=https://openaipublic.blob.core.windows.net/minecraft-rl/models
          case "${{ inputs.tag }}" in
            baseline) curl -sfL -o w/global.weights $B/foundation-model-1x.weights; ARCH=1x ;;
            openai-2x) curl -sfL -o w/global.weights $B/foundation-model-2x.weights; ARCH=2x ;;
            openai-3x) curl -sfL -o w/global.weights $B/foundation-model-3x.weights; ARCH=3x ;;
            openai-rl-2x) curl -sfL -o w/global.weights $B/rl-from-early-game-2x.weights; ARCH=2x ;;
            scratch-*) gh release download "${{ inputs.tag }}" -p global.weights -D w; ARCH=small ;;
            *) gh release download "${{ inputs.tag }}" -p global.weights -D w; ARCH=1x ;;
          esac
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          ls -la w
      - name: Evaluate
        run: xvfb-run -a -s "-screen 0 1024x768x24" python cloud/eval_job.py --weights w/global.weights --name "${{ inputs.tag }}" --arch "$ARCH" --max-minutes 105 --modes "${{ matrix.modes }}" --episodes "${{ inputs.episodes }}" --out eval --clips clips
      - uses: actions/upload-artifact@v4
        with: {name: "eval-${{ strategy.job-index }}", path: "eval\nclips"}
  publish:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: art}
      - name: Merge and attach
        run: |
          python3 - <<'EOF'
          import json, glob
          res = {"name": "${{ inputs.tag }}", "modes": {}}
          for f in glob.glob("art/**/*.json", recursive=True):
              res["modes"].update(json.load(open(f))["modes"])
          json.dump(res, open("eval.json", "w"), indent=1)
          print(len(res["modes"]), "modes evaluated")
          EOF
          TAG="${{ inputs.tag }}"
          case "$TAG" in
            baseline) T="Baseline: VPT foundation 1x"; N="Evaluation of the unmodified VPT foundation 1x model on all modes." ;;
            openai-2x) T="OpenAI VPT foundation 2x"; N="OpenAI's released 2x foundation model (no arena training), evaluated on all modes." ;;
            openai-3x) T="OpenAI VPT foundation 3x"; N="OpenAI's largest released foundation model (3x, no arena training), evaluated on all modes." ;;
            openai-rl-2x) T="OpenAI VPT RL early-game 2x"; N="OpenAI's final released RL model (2x, RL-tuned for the diamond tech tree), evaluated on all modes." ;;
            *) T="" ;;
          esac
          if [ -n "$T" ]; then gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$T" --notes "$N" --prerelease; fi
          gh release upload "$TAG" eval.json --clobber
          CLIPS=$(find art -name "*.mp4" | head -60)
          if [ -n "$CLIPS" ]; then
            mkdir -p up && for f in $CLIPS; do b=$(basename "$f" .mp4); case "$b" in *_60) cp "$f" "up/clip60-${b%_60}.mp4";; *) cp "$f" "up/clip-$b.mp4";; esac; done
            gh release upload "$TAG" up/*.mp4 --clobber
          fi
