name: trailer-theatrical
# One machine, one run: prep (real numbers and clips from the releases) -> stills -> Remotion render (1080p30; 1080p60 only if asked) -> two-pass encode -> release `trailer-theatrical`.
on:
  workflow_dispatch:
    inputs:
      render60:
        description: "also render 1080p60 (about twice the time)"
        type: boolean
        default: false
      stills_only:
        description: "only stills, no render and no release"
        type: boolean
        default: false
      stills:
        description: "still times in seconds"
        default: "4 10 13 16 25 28 31 34 40 47 55.5 58 61 65 68 72.5 75.3 77.5 79 85 88"
permissions:
  contents: write
jobs:
  theatrical:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 || true
          pip install -q requests
      - name: Prep (releases, eval.json, clips, live card, grain)
        run: |
          python3 trailer/tools/prep_cine.py
          cp trailer/audio/theatrical.mp3 trailer/public-cine/theatrical.mp3
      - name: Install
        working-directory: trailer
        run: npm install --no-audit --no-fund
      - name: Stills
        working-directory: trailer
        run: |
          mkdir -p out stills-out
          for T in ${{ inputs.stills }}; do
            F=$(python3 -c "print(int(round($T*30)))")
            npx remotion still src/cine/index.ts Theat30 out/s.png --frame=$F --props=props-cine.json --public-dir=public-cine --log=error
            ffmpeg -y -v error -i out/s.png -q:v 3 stills-out/theat-t$T.jpg
          done
      - uses: actions/upload-artifact@v4
        with:
          name: theat-stills
          path: trailer/stills-out
      - name: Render 1080p30
        if: ${{ !inputs.stills_only }}
        working-directory: trailer
        run: |
          date -u +%s > out/t0
          npx remotion render src/cine/index.ts Theat30 out/raw30.mp4 --props=props-cine.json --public-dir=public-cine --concurrency=4 --crf=14 --timeout=180000 --log=warn
      - name: Render 1080p60
        if: ${{ !inputs.stills_only && inputs.render60 }}
        working-directory: trailer
        run: npx remotion render src/cine/index.ts Theat60 out/raw60.mp4 --props=props-cine.json --public-dir=public-cine --concurrency=4 --crf=14 --timeout=180000 --log=warn
      - name: Two-pass encode (about 22 MB), yuv420p checks
        if: ${{ !inputs.stills_only }}
        run: |
          set -e
          echo "render seconds: $(( $(date -u +%s) - $(cat trailer/out/t0) ))"
          VB=$(python3 -c "print(int(22.0e6*8/90 - 140000))")
          for N in 30 60; do
            [ -f trailer/out/raw$N.mp4 ] || continue
            ffmpeg -y -v error -i trailer/out/raw$N.mp4 -c:v libx264 -preset slow -b:v $VB -pass 1 -an -f null /dev/null
            ffmpeg -y -v error -i trailer/out/raw$N.mp4 -c:v libx264 -preset slow -b:v $VB -pass 2 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart trailer-theatrical-$N.mp4
            ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,duration -of default=nw=1 trailer-theatrical-$N.mp4
            PF=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 trailer-theatrical-$N.mp4)
            [ "$PF" = "yuv420p" ] || { echo "pix_fmt is $PF"; exit 1; }
            SZ=$(stat -c %s trailer-theatrical-$N.mp4); echo "size $N: $SZ"
            [ "$SZ" -lt 24000000 ] || { echo "too big"; exit 1; }
            ffmpeg -y -v error -ss 75.3 -i trailer-theatrical-$N.mp4 -frames:v 1 -q:v 3 final-check-$N.jpg
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.stills_only }}
        with:
          name: theat-final-frames
          path: final-check-*.jpg
      - name: Release trailer-theatrical
        if: ${{ !inputs.stills_only }}
        run: |
          gh release view trailer-theatrical -R ${{ github.repository }} >/dev/null 2>&1 || gh release create trailer-theatrical -R ${{ github.repository }} --title "Theatrical trailer" --notes "Theatrical trailer: maximal blockbuster treatment. trailer-theatrical-30.mp4 (1080p30), trailer-theatrical-60.mp4 (1080p60, when present). Score on real sampled instruments (MuseScore_General SoundFont, MIT)." --latest=false
          gh release upload trailer-theatrical trailer-theatrical-*.mp4 -R ${{ github.repository }} --clobber
